<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUFE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa, #353e57);
            padding: 20px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 90%;
        }

        .titulo {
            font-size: clamp(2rem, 8vw, 4rem);
            color: #222;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .subtitulo {
            font-size: clamp(1rem, 3vw, 1.4rem);
            color: #444;
        }

        @media (max-width: 480px) {
            .titulo {
                font-size: 2rem;
            }

            .subtitulo {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="titulo">🚧 UNDER CONSTRUCTION 🚧</h1>
        <p class="subtitulo">
            O site está em desenvolvimento.<br>
            Volte em breve!
        </p>
    </div>
</body>
</html>
